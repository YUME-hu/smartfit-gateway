# =============================================================================
# uni-app → Android APK（离线打包）
#
# ⚠️ 放置位置：GitHub Actions 只认仓库根目录的 .github/workflows/。
#    如果 app-gateway 就是仓库根，这个路径已经正确；
#    如果它是一个子目录，把本文件移到仓库根的 .github/workflows/ 下，
#    并把下面所有 `working-directory` 改成你的子目录。
#
# 为什么走「离线打包」而不是 DCloud 云打包：
#   云打包需要在 CI 里登录 DCloud 账号并走厂商后端，账号凭证与配额都不可控；
#   离线打包是官方支持的本地 Gradle 流程，产物可复现。
#
# 前置条件（缺一不可，否则一定会失败）：
#   1. 项目必须是 **CLI 工程**（有 package.json 和 @dcloudio/* 依赖）。
#      HBuilderX 里"新建的空项目"没有 package.json，CLI 无法构建。
#      用 `npx degit dcloudio/uni-preset-vue#vite-ts my-app` 创建，
#      再把 src/gateway、pages、components 拷进去。
#   2. 必须提供 DCloud Android 离线 SDK 的下载直链（变量 ANDROID_SDK_URL），
#      版本必须与 package.json 里 @dcloudio 各包版本**一致**，否则启动白屏。
#   3. 需要签名密钥（secrets.ANDROID_KEYSTORE_BASE64 等）。
# =============================================================================
# 2026-11-17 更新：工程已迁到 uni-app CLI 布局，`npm run build:app` 现在真的能跑
#
#   · 入口都在 src/ 下：pages.json / manifest.json / App.vue / main.js
#   · 依赖：@dcloudio/uni-app · uni-app-plus · uni-components · uni-h5
#           + vite-plugin-uni + vite 5.2.8（见根 package.json）
#   · 本地实测：`uni build -p app` → dist/build/app（18 个文件 / 0.91 MB / 9s）
#
# 所以 build-assets job 现在应当全绿 —— 之前 17 次全红的根因（没有 build:app
# 脚本、也没有 @dcloudio 依赖）已经消除。
#
# 打成 APK 需要 3 个 Variables + 4 个签名 secrets；**缺任何一个 job 会直接失败并
# 逐条 ::error:: 报错**（不再静默跳过 —— 静默跳过会让人以为"打包过了"，其实没产物）：
#   1. vars.UNI_APP_ID       —— 必须与 src/manifest.json 的 appid 完全一致
#   2. vars.ANDROID_SDK_URL  —— DCloud Android 离线 SDK 的 zip 直链
#   3. vars.GRADLE_PROJECT   —— SDK 里 Gradle 工程的相对路径
#   以及 4 个签名 secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD /
#   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#
# 可选：vars.PATCH_DCLOUD_CONTROL = true
#   开启后，打包前会自动把 SDK 里 dcloud_control.xml 的 appid 改写成 UNI_APP_ID，
#   省掉"每次换 SDK 都要手动改一次"的步骤；改写前会打印原文、留 .bak、改完再校验。
#   默认不开：SDK 的 appid 已手工对齐时不需要它。
# =============================================================================
name: Build Android APK

on:
  # 2026-11-17：CLI 迁移完成后恢复 push 触发 —— 至少保证"app 资源构建得出来"这件事
  # 每次 push 都被验证。APK 那一步仍受下面 package-apk 的 if 条件门控。
  push:
    branches: [main]
  # 也支持在 Actions 页面手动触发
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # DCloud 应用的 appid，必须与 src/manifest.json 里的 "appid" 以及 SDK 的
  # dcloud_control.xml 完全一致（形如 __UNI__A1B2C3D）
  UNI_APP_ID: ${{ vars.UNI_APP_ID }}
  # Android 离线 SDK 的 zip 直链（建议自建对象存储或 Release 附件，别依赖第三方网盘）
  ANDROID_SDK_URL: ${{ vars.ANDROID_SDK_URL }}
  # SDK 解压后 Gradle 工程所在目录（不同版本路径不同，按实际调整）
  GRADLE_PROJECT: ${{ vars.GRADLE_PROJECT }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1：编译 uni-app 前端产物。
  # 不依赖任何 DCloud 私有资源，因此总是能跑，用来第一时间发现"代码编译不过"。
  # ---------------------------------------------------------------------------
  build-assets:
    name: 编译 uni-app 产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: 注入 .env（VITE_ 变量会被打进包，只放 anon key）
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DEVICE_ID=${{ vars.VITE_DEVICE_ID }}
          EOF

      - name: 构建 App 端资源
        run: npm run build:app

      - name: 校验产物存在
        run: |
          set -e
          test -d dist/build/app || { echo "dist/build/app 不存在，检查 package.json 的 build:app 脚本"; exit 1; }
          echo "产物大小："
          du -sh dist/build/app

      - uses: actions/upload-artifact@v4
        with:
          name: uni-app-assets
          path: dist/build/app
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2：把 Job 1 的产物塞进 DCloud 离线 SDK，Gradle 打出 release APK。
  #
  # 触发：只手动 Run workflow 时执行（push 只跑 Job 1 的资源构建检查）。
  # 前置：3 个 Variables + 6 个 Secrets。缺任何一个都**直接失败并逐条报错**，
  #       不再静默跳过 —— 静默跳过会让人以为"打包过了"，其实没有 APK 产物。
  # 产物：artifact `apk`（out/smartfit-<sha7>.apk）
  # ---------------------------------------------------------------------------
  package-apk:
    name: 打包 APK
    needs: build-assets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 校验前置变量与密钥
        env:
          UNI_APP_ID: ${{ vars.UNI_APP_ID }}
          ANDROID_SDK_URL: ${{ vars.ANDROID_SDK_URL }}
          GRADLE_PROJECT: ${{ vars.GRADLE_PROJECT }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -u
          missing=0
          need_var() { [ -n "${!1:-}" ] || { echo "::error::缺少 Variable  $1 —— $2"; missing=1; }; }
          need_sec() { [ -n "${!1:-}" ] || { echo "::error::缺少 Secret    $1 —— $2"; missing=1; }; }

          need_var UNI_APP_ID        "Settings → Variables：DCloud appid，须与 src/manifest.json、SDK 的 dcloud_control.xml 一致"
          need_var ANDROID_SDK_URL   "Settings → Variables：DCloud Android 离线 SDK 的 zip 直链"
          need_var GRADLE_PROJECT    "Settings → Variables：SDK zip 里 Gradle 工程的相对路径（常见为 SDK）"
          need_sec ANDROID_KEYSTORE_BASE64 "Settings → Secrets：release.keystore 的 base64"
          need_sec ANDROID_STORE_PASSWORD  "Settings → Secrets：keystore 密码"
          need_sec ANDROID_KEY_ALIAS       "Settings → Secrets：key alias"
          need_sec ANDROID_KEY_PASSWORD    "Settings → Secrets：key 密码"
          need_sec VITE_SUPABASE_URL       "Settings → Secrets：Supabase 项目 URL"
          need_sec VITE_SUPABASE_ANON_KEY  "Settings → Secrets：Supabase anon key"

          if [ "$missing" -ne 0 ]; then
            echo "::error::打包前置条件不完整（见上面逐条 ::error::）。补齐后重新 Run workflow。"
            exit 1
          fi
          echo "前置检查通过：3 个 Variable + 6 个 Secret 均已配置"

      - name: 取回 build-assets 产物
        uses: actions/download-artifact@v4
        with:
          name: uni-app-assets
          path: dist/build/app

      - name: 校验产物
        run: |
          set -e
          test -f dist/build/app/app-service.js || { echo "::error::产物里没有 app-service.js，build-assets 可能没成功"; exit 1; }
          du -sh dist/build/app

      - name: 下载并解压 Android 离线 SDK
        run: |
          set -e
          SDK_ZIP="$RUNNER_TEMP/dcloud-sdk.zip"
          echo "下载 SDK…"
          curl -fL --retry 3 --retry-delay 5 --max-time 1800 -o "$SDK_ZIP" "$ANDROID_SDK_URL"
          ls -lh "$SDK_ZIP"
          mkdir -p "$RUNNER_TEMP/sdk"
          unzip -q "$SDK_ZIP" -d "$RUNNER_TEMP/sdk"
          echo "解压后顶层目录："
          ls -la "$RUNNER_TEMP/sdk"
          if [ ! -d "$RUNNER_TEMP/sdk/$GRADLE_PROJECT" ]; then
            echo "::error::GRADLE_PROJECT=$GRADLE_PROJECT 在 SDK 里不存在；把上面列出的某个目录名填进这个 Variable。"
            exit 1
          fi
          echo "SDK_DIR=$RUNNER_TEMP/sdk/$GRADLE_PROJECT" >> "$GITHUB_ENV"

      - name: 改写 dcloud_control.xml 的 appid（可选，由 Variable 开关控制）
        if: vars.PATCH_DCLOUD_CONTROL == 'true'
        run: |
          set -e
          CTRL=$(find "$SDK_DIR" -name dcloud_control.xml | head -n 1)
          [ -n "$CTRL" ] || { echo "::error::SDK 里找不到 dcloud_control.xml"; exit 1; }
          echo "::notice::PATCH_DCLOUD_CONTROL=true —— 自动把 appid 改写为 $UNI_APP_ID"
          cp "$CTRL" "$CTRL.bak"
          echo "改写前："
          cat "$CTRL"
          # 只替换 appid 属性的值，保留属性名与等号周围原有写法；文件里若有多处 appid 一并替换
          sed -i -E "s/(appid[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${UNI_APP_ID}\2/g" "$CTRL"
          echo "改写后："
          cat "$CTRL"
          if ! grep -Eq "appid[[:space:]]*=[[:space:]]*\"${UNI_APP_ID}\"" "$CTRL"; then
            echo "::error::自动改写失败：$CTRL 里没找到可替换的 appid 属性（上面是改写后的内容）。请手动改，或把 PATCH_DCLOUD_CONTROL 关掉。"
            exit 1
          fi
          echo "appid 已改写（原文件备份为 $(basename "$CTRL").bak）"

      - name: 校验 appid 与 SDK 一致
        run: |
          set -e
          CTRL=$(find "$SDK_DIR" -name dcloud_control.xml | head -n 1)
          [ -n "$CTRL" ] || { echo "::error::SDK 里找不到 dcloud_control.xml"; exit 1; }
          echo "dcloud_control.xml: $CTRL"
          cat "$CTRL"
          grep -q "$UNI_APP_ID" "$CTRL" || {
            echo "::error::appid 不一致：UNI_APP_ID=$UNI_APP_ID 不在 dcloud_control.xml 里。改 SDK 的 dcloud_control.xml，或把 src/manifest.json 的 appid 改成 SDK 里那个。"
            exit 1
          }

      - name: 把前端产物放进 SDK 的 assets
        run: |
          set -e
          TARGET="$SDK_DIR/app/src/main/assets/apps/$UNI_APP_ID"
          mkdir -p "$TARGET"
          rm -rf "$TARGET/www"
          cp -r dist/build/app "$TARGET/www"
          test -f "$TARGET/www/app-service.js"
          echo "已写入 $TARGET/www"

      - name: 恢复签名密钥
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          cat > "$SDK_DIR/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 "$RUNNER_TEMP/release.keystore"
          echo "keystore 与 keystore.properties 已就绪（未回显密码）"

      - name: 打印 SDK 的签名配置（首次打包排查用）
        run: |
          echo "== $SDK_DIR/app/build.gradle 里的 signingConfigs =="
          grep -n -A8 "signingConfigs" "$SDK_DIR/app/build.gradle" || echo "(没找到 signingConfigs 段)"
          echo "== keystore.properties 位置 =="
          ls -l "$SDK_DIR/keystore.properties" || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 打包
        working-directory: ${{ runner.temp }}/sdk/${{ vars.GRADLE_PROJECT }}
        run: |
          set -e
          chmod +x gradlew || true
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          set -e
          SRC=$(find "$SDK_DIR" -name "*-release*.apk" | head -n 1)
          [ -n "$SRC" ] || { echo "::error::没找到 *-release*.apk，检查 Gradle 日志"; exit 1; }
          mkdir -p out
          cp "$SRC" "out/smartfit-${GITHUB_SHA::7}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 14
