# =============================================================================
# uni-app → Android APK（离线打包）
#
# ⚠️ 放置位置：GitHub Actions 只认仓库根目录的 .github/workflows/。
#    如果 app-gateway 就是仓库根，这个路径已经正确；
#    如果它是一个子目录，把本文件移到仓库根的 .github/workflows/ 下，
#    并把下面所有 `working-directory` 改成你的子目录。
#
# 为什么走「离线打包」而不是 DCloud 云打包：
#   云打包需要在 CI 里登录 DCloud 账号并走厂商后端，账号凭证与配额都不可控；
#   离线打包是官方支持的本地 Gradle 流程，产物可复现。
#
# 前置条件（缺一不可，否则一定会失败）：
#   1. 项目必须是 **CLI 工程**（有 package.json 和 @dcloudio/* 依赖）。
#      HBuilderX 里"新建的空项目"没有 package.json，CLI 无法构建。
#      用 `npx degit dcloudio/uni-preset-vue#vite-ts my-app` 创建，
#      再把 src/gateway、pages、components 拷进去。
#   2. 必须提供 DCloud Android 离线 SDK 的下载直链（变量 ANDROID_SDK_URL），
#      版本必须与 package.json 里 @dcloudio 各包版本**一致**，否则启动白屏。
#   3. 需要签名密钥（secrets.ANDROID_KEYSTORE_BASE64 等）。
# =============================================================================
# 2026-11-17 更新：工程已迁到 uni-app CLI 布局，`npm run build:app` 现在真的能跑
#
#   · 入口都在 src/ 下：pages.json / manifest.json / App.vue / main.js
#   · 依赖：@dcloudio/uni-app · uni-app-plus · uni-components · uni-h5
#           + vite-plugin-uni + vite 5.2.8（见根 package.json）
#   · 本地实测：`uni build -p app` → dist/build/app（18 个文件 / 0.91 MB / 9s）
#
# 所以 build-assets job 现在应当全绿 —— 之前 17 次全红的根因（没有 build:app
# 脚本、也没有 @dcloudio 依赖）已经消除。
#
# 打成 APK 需要 3 个 Variables + 4 个签名 secrets；**缺任何一个 job 会直接失败并
# 逐条 ::error:: 报错**（不再静默跳过 —— 静默跳过会让人以为"打包过了"，其实没产物）：
#   1. vars.UNI_APP_ID       —— 必须与 src/manifest.json 的 appid 完全一致
#   2. vars.ANDROID_SDK_URL  —— DCloud Android 离线 SDK 的 zip 直链
#   3. vars.GRADLE_PROJECT   —— SDK 里 Gradle 工程的相对路径
#   以及 4 个签名 secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD /
#   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#
# 可选：vars.PATCH_DCLOUD_CONTROL = true
#   开启后，打包前会自动把 SDK 里 dcloud_control.xml 的 appid 改写成 UNI_APP_ID，
#   省掉"每次换 SDK 都要手动改一次"的步骤；改写前会打印原文、留 .bak、改完再校验。
#   默认不开：SDK 的 appid 已手工对齐时不需要它。
#
# 可选：vars.ANDROID_SDK_SHA256
#   填了就在下载后做 sha256sum -c 校验，防下载截断 / 防被人换包；不填则只打印实际哈希。
#
# GRADLE_PROJECT 填错不会直接死：若该目录不存在，会自动搜索含 gradlew 的目录并提示。
# =============================================================================
name: Build Android APK

on:
  # 2026-11-17：CLI 迁移完成后恢复 push 触发 —— 至少保证"app 资源构建得出来"这件事
  # 每次 push 都被验证。APK 那一步仍受下面 package-apk 的 if 条件门控。
  push:
    branches: [main]
  # 也支持在 Actions 页面手动触发
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # DCloud 应用的 appid，必须与 src/manifest.json 里的 "appid" 以及 SDK 的
  # dcloud_control.xml 完全一致（形如 __UNI__A1B2C3D）
  UNI_APP_ID: ${{ vars.UNI_APP_ID }}
  # Android 离线 SDK 的 zip 直链（建议自建对象存储或 Release 附件，别依赖第三方网盘）
  ANDROID_SDK_URL: ${{ vars.ANDROID_SDK_URL }}
  # SDK 解压后 Gradle 工程所在目录（不同版本路径不同，按实际调整）
  GRADLE_PROJECT: ${{ vars.GRADLE_PROJECT }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1：编译 uni-app 前端产物。
  # 不依赖任何 DCloud 私有资源，因此总是能跑，用来第一时间发现"代码编译不过"。
  # ---------------------------------------------------------------------------
  build-assets:
    name: 编译 uni-app 产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: 注入 .env（VITE_ 变量会被打进包，只放 anon key）
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DEVICE_ID=${{ vars.VITE_DEVICE_ID }}
          EOF

      - name: 构建 App 端资源
        run: npm run build:app

      - name: 校验产物存在
        run: |
          set -e
          test -d dist/build/app || { echo "dist/build/app 不存在，检查 package.json 的 build:app 脚本"; exit 1; }
          echo "产物大小："
          du -sh dist/build/app

      - uses: actions/upload-artifact@v4
        with:
          name: uni-app-assets
          path: dist/build/app
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2：把 Job 1 的产物塞进 DCloud 离线 SDK，Gradle 打出 release APK。
  #
  # 触发：只手动 Run workflow 时执行（push 只跑 Job 1 的资源构建检查）。
  # 前置：3 个 Variables + 6 个 Secrets。缺任何一个都**直接失败并逐条报错**，
  #       不再静默跳过 —— 静默跳过会让人以为"打包过了"，其实没有 APK 产物。
  # 产物：artifact `apk`（out/smartfit-<sha7>.apk）
  # ---------------------------------------------------------------------------
  package-apk:
    name: 打包 APK
    needs: build-assets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 校验前置变量与密钥
        env:
          UNI_APP_ID: ${{ vars.UNI_APP_ID }}
          ANDROID_SDK_URL: ${{ vars.ANDROID_SDK_URL }}
          GRADLE_PROJECT: ${{ vars.GRADLE_PROJECT }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -u
          missing=0
          need_var() { [ -n "${!1:-}" ] || { echo "::error::缺少 Variable  $1 —— $2"; missing=1; }; }
          need_sec() { [ -n "${!1:-}" ] || { echo "::error::缺少 Secret    $1 —— $2"; missing=1; }; }

          need_var UNI_APP_ID        "Settings → Variables：DCloud appid，须与 src/manifest.json、SDK 的 dcloud_control.xml 一致"
          need_var ANDROID_SDK_URL   "Settings → Variables：DCloud Android 离线 SDK 的 zip 直链"
          need_var GRADLE_PROJECT    "Settings → Variables：SDK zip 里 Gradle 工程的相对路径（常见为 SDK）"
          need_sec ANDROID_KEYSTORE_BASE64 "Settings → Secrets：release.keystore 的 base64"
          need_sec ANDROID_STORE_PASSWORD  "Settings → Secrets：keystore 密码"
          need_sec ANDROID_KEY_ALIAS       "Settings → Secrets：key alias"
          need_sec ANDROID_KEY_PASSWORD    "Settings → Secrets：key 密码"
          need_sec VITE_SUPABASE_URL       "Settings → Secrets：Supabase 项目 URL"
          need_sec VITE_SUPABASE_ANON_KEY  "Settings → Secrets：Supabase anon key"

          if [ "$missing" -ne 0 ]; then
            echo "::error::打包前置条件不完整（见上面逐条 ::error::）。补齐后重新 Run workflow。"
            exit 1
          fi
          echo "前置检查通过：3 个 Variable + 6 个 Secret 均已配置"

      - name: 取回 build-assets 产物
        uses: actions/download-artifact@v4
        with:
          name: uni-app-assets
          path: dist/build/app

      - name: 校验产物
        run: |
          set -e
          test -f dist/build/app/app-service.js || { echo "::error::产物里没有 app-service.js，build-assets 可能没成功"; exit 1; }
          du -sh dist/build/app

      - name: 下载并解压 Android 离线 SDK
        env:
          ANDROID_SDK_SHA256: ${{ vars.ANDROID_SDK_SHA256 }}
        run: |
          set -eu
          SDK_ZIP="$RUNNER_TEMP/dcloud-sdk.zip"
          echo "下载 SDK…"
          curl -fL --retry 3 --retry-delay 5 --max-time 1800 -o "$SDK_ZIP" "$ANDROID_SDK_URL"
          ls -lh "$SDK_ZIP"

          # 可选：配置了 ANDROID_SDK_SHA256 就校验包完整性（防截断/防换包）
          if [ -n "${ANDROID_SDK_SHA256:-}" ]; then
            echo "校验 SHA256…"
            echo "$ANDROID_SDK_SHA256  $SDK_ZIP" | sha256sum -c - || {
              echo "::error::SDK 包 SHA256 与 ANDROID_SDK_SHA256 不符（可能下载被截断或文件被换过）。"
              exit 1
            }
          else
            echo "（未配置 ANDROID_SDK_SHA256，跳过完整性校验；建议配上）"
            sha256sum "$SDK_ZIP"
          fi

          mkdir -p "$RUNNER_TEMP/sdk"
          unzip -q "$SDK_ZIP" -d "$RUNNER_TEMP/sdk"
          echo "解压后顶层目录："
          ls -la "$RUNNER_TEMP/sdk"

          # GRADLE_PROJECT 指向的目录不存在时，自动找含 gradlew 的目录（SDK 版本不同目录名会变）
          if [ ! -d "$RUNNER_TEMP/sdk/$GRADLE_PROJECT" ]; then
            echo "::warning::GRADLE_PROJECT=$GRADLE_PROJECT 不存在，尝试自动定位 gradlew…"
            CAND=$(find "$RUNNER_TEMP/sdk" -maxdepth 4 -name gradlew -printf '%h\n' | head -n 1 || true)
            if [ -z "$CAND" ]; then
              echo "::error::SDK 里既没有 $GRADLE_PROJECT，也找不到 gradlew。上面是解压后的目录结构。"
              exit 1
            fi
            REL=${CAND#"$RUNNER_TEMP/sdk/"}
            echo "::notice::自动选中 Gradle 工程：$REL"
            GRADLE_PROJECT="$REL"
            echo "GRADLE_PROJECT=$GRADLE_PROJECT" >> "$GITHUB_ENV"
          fi

          # 先落到 shell 变量：写进 $GITHUB_ENV 只对**后续步骤**生效，本步骤里 $SDK_DIR 还是空的
          # （这就是第二次 CI 失败的原因：find "" -> "No such file or directory"）
          SDK_DIR="$RUNNER_TEMP/sdk/$GRADLE_PROJECT"
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "最终使用 SDK_DIR=$SDK_DIR"

          # 定位 App 模块：DCloud 模板里可能叫 app（HelloUniApp）也可能叫 simpleDemo（Integrate-AS）
          # 注意深度：<project>/app/src/main/AndroidManifest.xml 是从 SDK_DIR 往下第 4 层，
          # maxdepth 3 会漏掉（第一次 CI 就是栽在这里）。
          MANIFEST=$(find "$SDK_DIR" -maxdepth 5 -path '*/src/main/AndroidManifest.xml' | sort | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::在 SDK 工程里找不到 */src/main/AndroidManifest.xml，无法定位 App 模块。"
            echo "--- SDK_DIR 下三层目录 ---"
            find "$SDK_DIR" -maxdepth 3 -type d | head -n 40
            exit 1
          fi
          MODULE_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST")")")
          echo "MODULE_DIR=$MODULE_DIR" >> "$GITHUB_ENV"
          echo "App 模块目录: $MODULE_DIR"

      - name: 改写 dcloud_control.xml 的 appid（可选，由 Variable 开关控制）
        if: vars.PATCH_DCLOUD_CONTROL == 'true'
        run: |
          set -e
          CTRL=$(find "$SDK_DIR" -name dcloud_control.xml | head -n 1)
          [ -n "$CTRL" ] || { echo "::error::SDK 里找不到 dcloud_control.xml"; exit 1; }
          echo "::notice::PATCH_DCLOUD_CONTROL=true —— 自动把 appid 改写为 $UNI_APP_ID"
          cp "$CTRL" "$CTRL.bak"
          echo "改写前："
          cat "$CTRL"
          # 只替换 appid 属性的值，保留属性名与等号周围原有写法；文件里若有多处 appid 一并替换
          sed -i -E "s/(appid[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1${UNI_APP_ID}\2/g" "$CTRL"
          echo "改写后："
          cat "$CTRL"
          if ! grep -Eq "appid[[:space:]]*=[[:space:]]*\"${UNI_APP_ID}\"" "$CTRL"; then
            echo "::error::自动改写失败：$CTRL 里没找到可替换的 appid 属性（上面是改写后的内容）。请手动改，或把 PATCH_DCLOUD_CONTROL 关掉。"
            exit 1
          fi
          echo "appid 已改写（原文件备份为 $(basename "$CTRL").bak）"

      - name: 校验 appid 与 SDK 一致
        run: |
          set -e
          CTRL=$(find "$SDK_DIR" -name dcloud_control.xml | head -n 1)
          [ -n "$CTRL" ] || { echo "::error::SDK 里找不到 dcloud_control.xml"; exit 1; }
          echo "dcloud_control.xml: $CTRL"
          cat "$CTRL"
          grep -q "$UNI_APP_ID" "$CTRL" || {
            echo "::error::appid 不一致：UNI_APP_ID=$UNI_APP_ID 不在 dcloud_control.xml 里。改 SDK 的 dcloud_control.xml，或把 src/manifest.json 的 appid 改成 SDK 里那个。"
            exit 1
          }

      - name: 把前端产物放进 SDK 的 assets
        run: |
          set -e
          TARGET="$MODULE_DIR/src/main/assets/apps/$UNI_APP_ID"
          mkdir -p "$TARGET"
          rm -rf "$TARGET/www"
          cp -r dist/build/app "$TARGET/www"
          test -f "$TARGET/www/app-service.js"
          echo "已写入 $TARGET/www"

      - name: 适配签名配置（把模板写死的 test.jks 换成我们的 keystore）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          GRADLE_FILE="$MODULE_DIR/build.gradle"
          [ -f "$GRADLE_FILE" ] || { echo "::error::$GRADLE_FILE 不存在，无法改签名配置"; exit 1; }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore" || { echo "::error::keystore 解码后是空文件，检查 ANDROID_KEYSTORE_BASE64"; exit 1; }
          chmod 600 "$RUNNER_TEMP/release.keystore"

          echo "== 改写前 =="
          sed -n '/signingConfigs/,/^    }/p' "$GRADLE_FILE" | head -n 12

          cp "$GRADLE_FILE" "$GRADLE_FILE.bak"
          # DCloud 模板里签名是写死的（key0 / 123456 / test.jks）——不改的话 APK 会用 demo 的公开
          # 测试证书签出来：构建绿、能装，但不是你的签名，以后无法覆盖升级。这里统一改成读环境变量。
          sed -i -E \
            -e "s|^([[:space:]]*)keyAlias .*|\1keyAlias System.getenv(\"SMARTFIT_KEY_ALIAS\")|" \
            -e "s|^([[:space:]]*)keyPassword .*|\1keyPassword System.getenv(\"SMARTFIT_KEY_PASSWORD\")|" \
            -e "s|^([[:space:]]*)storeFile .*|\1storeFile file(System.getenv(\"SMARTFIT_KEYSTORE\"))|" \
            -e "s|^([[:space:]]*)storePassword .*|\1storePassword System.getenv(\"SMARTFIT_STORE_PASSWORD\")|" \
            "$GRADLE_FILE"

          echo "== 改写后 =="
          sed -n '/signingConfigs/,/^    }/p' "$GRADLE_FILE" | head -n 12
          grep -q 'SMARTFIT_KEYSTORE' "$GRADLE_FILE" || { echo "::error::自动改写签名配置失败：build.gradle 里没有找到可替换的 storeFile 行"; exit 1; }

          {
            echo "SMARTFIT_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "SMARTFIT_STORE_PASSWORD=$ANDROID_STORE_PASSWORD"
            echo "SMARTFIT_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "SMARTFIT_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "签名配置已改为读环境变量（原 build.gradle 备份为 build.gradle.bak）"

      - name: 改桌面显示名（可选，失败只警告不影响出包）
        env:
          APP_ICON_URL: ${{ vars.APP_ICON_URL }}
        run: |
          set -eu
          # 只改"壳"的桌面显示名。applicationId / versionCode 保持模板默认值
          # （com.android.HelloH5 / 1.0）—— 改它们会牵动 DCloud 壳里的 provider authority
          # 和 manifest 占位符，容易让 Gradle 在 manifest merger 阶段失败；
          # 毕设只需要桌面名字对，不值得冒这个险。
          APP_NAME=$(node -e "const fs=require('fs');const s=fs.readFileSync('dist/build/app/manifest.json','utf8').replace(/^\uFEFF/,'');console.log(JSON.parse(s).name||'SmartFit')" || echo SmartFit)
          echo "目标显示名: $APP_NAME"

          STRINGS="$MODULE_DIR/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            # ⚠️ 备份绝对不能放在 res/ 下：Android 资源合并器只认 .xml，
            # 出现 strings.xml.bak 会让 :app:mergeReleaseResources 直接失败。
            cp "$STRINGS" "$RUNNER_TEMP/strings.xml.bak" || true
            if sed -i -E "s#(<string name=\"app_name\">)[^<]*(</string>)#\1$APP_NAME\2#" "$STRINGS" && grep -q ">$APP_NAME<" "$STRINGS"; then
              echo "::notice::桌面显示名已改为 $APP_NAME"
              cat "$STRINGS"
            else
              echo "::warning::strings.xml 改写失败，保留模板名 HBuilder-Hello（不影响出包）"
              cat "$STRINGS" || true
            fi
          else
            echo "::warning::找不到 $STRINGS，跳过改名（不影响出包）"
          fi

          # 可选：换图标（APP_ICON_URL 指向一张 png；失败只警告）
          if [ -n "${APP_ICON_URL:-}" ]; then
            ICON="$MODULE_DIR/src/main/res/drawable-xxhdpi/icon.png"
            if curl -fL --max-time 120 -o "$ICON" "$APP_ICON_URL"; then
              echo "::notice::图标已替换"
            else
              echo "::warning::图标下载失败，保留模板图标"
            fi
          fi

      - name: 打印 SDK 的签名配置（首次打包排查用）
        run: |
          echo "== $MODULE_DIR/build.gradle 里的 signingConfigs =="
          sed -n '/signingConfigs/,/^    }/p' "$MODULE_DIR/build.gradle" || true
          echo "== buildTypes 里的 signingConfig 引用 =="
          grep -n "signingConfig " "$MODULE_DIR/build.gradle" || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 打包
        run: |
          set -e
          cd "$SDK_DIR"
          echo "Gradle 工程目录: $PWD"
          chmod +x gradlew || true
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          set -e
          SRC=$(find "$SDK_DIR" -name "*-release*.apk" | head -n 1)
          [ -n "$SRC" ] || { echo "::error::没找到 *-release*.apk，检查 Gradle 日志"; exit 1; }
          mkdir -p out
          cp "$SRC" "out/smartfit-${GITHUB_SHA::7}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 14
